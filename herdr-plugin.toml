id = "hertrees"
name = "Hertrees"
version = "0.2.8"
# Needs worktree.list/create/open, agent.start/wait/prompt and popup plugin panes.
min_herdr_version = "0.9.3"
description = "Every git worktree of a project with its PR state, and agent sessions, in one popup"
platforms = ["linux", "macos", "windows"]

# On install Herdr runs this in the plugin directory: it downloads the release's
# prebuilt bin/hertrees (bin/hertrees.exe on Windows), or builds it from source
# with cargo (Rust 1.88+). Windows also gets an extensionless bin/hertrees copy,
# so the pane command below runs there as written.
[[build]]
command = ["sh", "scripts/install.sh"]
platforms = ["linux", "macos"]

[[build]]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/install.ps1"]
platforms = ["windows"]

# Opening the picker is a one-liner through the Herdr CLI. HERDR_BIN_PATH can
# outlive the binary it points at when Herdr is upgraded under a running
# server, so fall back to whatever is on PATH (the same fallback the installed binary uses).
[[actions]]
id = "open"
title = "Open worktrees"
description = "Worktrees of this project, their pull requests, and agent sessions"
contexts = ["global"]
platforms = ["linux", "macos"]
command = [
  "sh",
  "-c",
  'herdr_bin="${HERDR_BIN_PATH:-herdr}"; [ -x "$herdr_bin" ] || herdr_bin=herdr; exec "$herdr_bin" plugin pane open --plugin hertrees --entrypoint picker --placement popup',
]

# Windows has no `sh`, and Herdr rejects a second `open` action even with a
# different `platforms` list, so Windows gets its own id. The same one-liner
# lives in the binary's --open.
[[actions]]
id = "open-windows"
title = "Open worktrees"
description = "Worktrees of this project, their pull requests, and agent sessions"
contexts = ["global"]
platforms = ["windows"]
command = ["bin/hertrees.exe", "--open"]

# Popup geometry: most of the screen, centred.
[[panes]]
id = "picker"
title = "Worktrees"
description = "Worktrees of this project, their pull requests, and agent sessions"
placement = "popup"
width = "74%"
height = "62%"
command = ["bin/hertrees"]
